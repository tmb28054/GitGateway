<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0b3d5c"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#0b3d5c;stroke-width:1.5;rx:6;}
      .aws{fill:#eef4f8;stroke:#0b3d5c;stroke-width:1.5;}
      .ext{fill:#fdf1e6;stroke:#c47a2c;stroke-width:1.5;}
      .lam{fill:#0b3d5c;stroke:#0b3d5c;}
      .t{font-size:12px;fill:#12222e;}
      .tw{font-size:12px;fill:#ffffff;font-weight:bold;}
      .sub{font-size:10px;fill:#4a5f6d;}
      .lbl{font-size:9.5px;fill:#0b3d5c;}
      .zone{fill:none;stroke:#c47a2c;stroke-width:1.2;stroke-dasharray:5 4;}
      .zlbl{font-size:10px;fill:#c47a2c;font-weight:bold;}
      .flow{stroke:#0b3d5c;stroke-width:1.5;fill:none;}
    </style>
  </defs>

  <text x="470" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b3d5c">GitGateway — Architecture &amp; Trust Boundaries</text>

  <!-- Client -->
  <rect class="box aws" x="360" y="46" width="220" height="46" rx="6"/>
  <text class="t" x="470" y="66" text-anchor="middle" font-weight="bold">Clients</text>
  <text class="sub" x="470" y="82" text-anchor="middle">git CLI · git-lfs · CLI tool · browser</text>

  <!-- CloudFront -->
  <rect class="box aws" x="330" y="120" width="280" height="46" rx="6"/>
  <text class="t" x="470" y="140" text-anchor="middle" font-weight="bold">CloudFront + ACM</text>
  <text class="sub" x="470" y="156" text-anchor="middle">TLS 1.2+ · redirect-to-https · https-only origin</text>

  <!-- API GW -->
  <rect class="box aws" x="330" y="192" width="280" height="46" rx="6"/>
  <text class="t" x="470" y="212" text-anchor="middle" font-weight="bold">API Gateway v2 (HTTP API)</text>
  <text class="sub" x="470" y="228" text-anchor="middle">$default route · AWS_PROXY · no authorizer</text>

  <!-- Lambda -->
  <rect class="box lam" x="310" y="264" width="320" height="56" rx="6"/>
  <text class="tw" x="470" y="286" text-anchor="middle">Lambda handler (python3.12)</text>
  <text x="470" y="304" text-anchor="middle" font-size="10" fill="#cfe2ee">in-code routing · auth · RBAC · git · LFS · API · web</text>

  <!-- data services row -->
  <rect class="box aws" x="40"  y="400" width="150" height="70" rx="6"/>
  <text class="t" x="115" y="424" text-anchor="middle" font-weight="bold">S3</text>
  <text class="sub" x="115" y="440" text-anchor="middle">repos (KMS)</text>
  <text class="sub" x="115" y="454" text-anchor="middle">lfs (KMS)</text>
  <text class="sub" x="115" y="468" text-anchor="middle">backups (AES256)</text>

  <rect class="box aws" x="210" y="400" width="170" height="70" rx="6"/>
  <text class="t" x="295" y="424" text-anchor="middle" font-weight="bold">DynamoDB</text>
  <text class="sub" x="295" y="440" text-anchor="middle">repos · access · prs</text>
  <text class="sub" x="295" y="454" text-anchor="middle">audit · status · notifs</text>
  <text class="sub" x="295" y="468" text-anchor="middle">default-key encryption</text>

  <rect class="box aws" x="400" y="400" width="160" height="70" rx="6"/>
  <text class="t" x="480" y="424" text-anchor="middle" font-weight="bold">Secrets Manager</text>
  <text class="sub" x="480" y="440" text-anchor="middle">IdP config</text>
  <text class="sub" x="480" y="454" text-anchor="middle">mirror creds</text>
  <text class="sub" x="480" y="468" text-anchor="middle">Gemini key</text>

  <rect class="box aws" x="580" y="400" width="160" height="70" rx="6"/>
  <text class="t" x="660" y="424" text-anchor="middle" font-weight="bold">CodeBuild + SNS</text>
  <text class="sub" x="660" y="440" text-anchor="middle">nightly backup</text>
  <text class="sub" x="660" y="454" text-anchor="middle">restore</text>
  <text class="sub" x="660" y="468" text-anchor="middle">EventBridge cron · alerts</text>

  <!-- external -->
  <rect class="box ext" x="770" y="264" width="150" height="206" rx="6"/>
  <text class="t" x="845" y="286" text-anchor="middle" font-weight="bold" fill="#8a5316">External</text>
  <text class="sub" x="845" y="316" text-anchor="middle">IdP (OAuth/JWT)</text>
  <text class="sub" x="845" y="346" text-anchor="middle">Gemini (AI)</text>
  <text class="sub" x="845" y="376" text-anchor="middle">mirror targets</text>
  <text class="sub" x="845" y="406" text-anchor="middle">SES (email)</text>

  <!-- vertical flows -->
  <path class="flow" d="M470,92 L470,118" marker-end="url(#arw)"/>
  <path class="flow" d="M470,166 L470,190" marker-end="url(#arw)"/>
  <path class="flow" d="M470,238 L470,262" marker-end="url(#arw)"/>

  <!-- lambda to data services -->
  <path class="flow" d="M360,320 L150,398" marker-end="url(#arw)"/>
  <path class="flow" d="M420,320 L305,398" marker-end="url(#arw)"/>
  <path class="flow" d="M480,320 L480,398" marker-end="url(#arw)"/>
  <path class="flow" d="M545,320 L650,398" marker-end="url(#arw)"/>
  <!-- lambda to external -->
  <path class="flow" d="M630,300 L768,320" marker-end="url(#arw)"/>

  <!-- trust boundaries -->
  <rect class="zone" x="300" y="38" width="340" height="136" rx="8"/>
  <text class="zlbl" x="308" y="54">Public / Internet boundary</text>

  <rect class="zone" x="24" y="252" width="740" height="230" rx="8"/>
  <text class="zlbl" x="32" y="268">AWS account boundary (711387107691)</text>

  <rect class="zone" x="760" y="252" width="168" height="230" rx="8"/>
  <text class="zlbl" x="768" y="268">3rd-party egress</text>
</svg>

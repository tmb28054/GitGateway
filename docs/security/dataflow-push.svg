<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0b3d5c"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#0b3d5c;stroke-width:1.5;}
      .lam{fill:#0b3d5c;}
      .store{fill:#eef4f8;stroke:#0b3d5c;stroke-width:1.5;}
      .t{font-size:12px;fill:#12222e;}
      .tw{font-size:12px;fill:#ffffff;font-weight:bold;}
      .sub{font-size:10px;fill:#4a5f6d;}
      .step{font-size:10px;fill:#0b3d5c;}
      .num{font-size:11px;fill:#c47a2c;font-weight:bold;}
      .flow{stroke:#0b3d5c;stroke-width:1.6;fill:none;}
      .note{font-size:9.5px;fill:#8a5316;}
    </style>
  </defs>

  <text x="470" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b3d5c">Data Flow — git push (git-receive-pack)</text>

  <!-- lanes -->
  <rect class="box" x="30"  y="60" width="150" height="44" rx="6"/>
  <text class="t" x="105" y="80" text-anchor="middle" font-weight="bold">git client</text>
  <text class="sub" x="105" y="96" text-anchor="middle">Basic __token__</text>

  <rect class="box" x="250" y="60" width="170" height="44" rx="6"/>
  <text class="t" x="335" y="80" text-anchor="middle" font-weight="bold">CloudFront /</text>
  <text class="sub" x="335" y="96" text-anchor="middle">API Gateway (~10MB cap)</text>

  <rect class="box lam" x="490" y="52" width="200" height="60" rx="6"/>
  <text class="tw" x="590" y="76" text-anchor="middle">Lambda</text>
  <text x="590" y="94" text-anchor="middle" font-size="10" fill="#cfe2ee">authenticate → scope check</text>

  <rect class="store" x="760" y="60" width="150" height="44" rx="6"/>
  <text class="t" x="835" y="80" text-anchor="middle" font-weight="bold">S3 + DynamoDB</text>
  <text class="sub" x="835" y="96" text-anchor="middle">repo objects · tree index</text>

  <!-- step boxes down the middle -->
  <g>
    <path class="flow" d="M180,82 L248,82" marker-end="url(#a2)"/>
    <text class="num" x="200" y="74">1</text>
    <text class="step" x="188" y="120">POST git-receive-pack</text>
  </g>
  <g>
    <path class="flow" d="M420,82 L488,82" marker-end="url(#a2)"/>
    <text class="num" x="446" y="74">2</text>
  </g>

  <!-- lambda internal pipeline -->
  <rect class="box" x="360" y="170" width="460" height="300" rx="8" fill="#f7fafc"/>
  <text class="t" x="590" y="192" text-anchor="middle" font-weight="bold" fill="#0b3d5c">Inside Lambda (git_backend.py)</text>

  <rect class="box" x="390" y="208" width="400" height="38" rx="5"/>
  <text class="step" x="410" y="231"><tspan class="num">3</tspan>  Authenticate: JWT then PAT (_authenticate_git_request)</text>

  <rect class="box" x="390" y="256" width="400" height="38" rx="5" fill="#fdeeee" stroke="#b23b3b"/>
  <text class="step" x="410" y="279" fill="#8a2a2a"><tspan class="num" fill="#b23b3b">4</tspan>  Scope gate: read → 403; NO per-repo RBAC (F-3/F-4)</text>

  <rect class="box" x="390" y="304" width="400" height="38" rx="5"/>
  <text class="step" x="410" y="327"><tspan class="num">5</tspan>  Sync bare repo S3 → /tmp (10GB ephemeral)</text>

  <rect class="box" x="390" y="352" width="400" height="38" rx="5"/>
  <text class="step" x="410" y="375"><tspan class="num">6</tspan>  Parse pkt-lines + PACK; apply ref updates (Dulwich)</text>

  <rect class="box" x="390" y="400" width="400" height="38" rx="5"/>
  <text class="step" x="410" y="423"><tspan class="num">7</tspan>  Re-sync /tmp → S3; index tree/commits → DynamoDB (F-7)</text>

  <path class="flow" d="M590,112 L590,168" marker-end="url(#a2)"/>

  <!-- to stores -->
  <path class="flow" d="M790,323 C860,323 860,150 835,106" marker-end="url(#a2)"/>
  <path class="flow" d="M790,419 C880,419 880,160 850,106" marker-end="url(#a2)"/>

  <!-- post push -->
  <rect class="box" x="30" y="200" width="300" height="90" rx="8" fill="#fff8ef" stroke="#c47a2c"/>
  <text class="t" x="180" y="222" text-anchor="middle" font-weight="bold" fill="#8a5316">After push (async, best-effort)</text>
  <text class="note" x="48" y="244">• Re-run linters / SAST on open PRs</text>
  <text class="note" x="48" y="262">• AI review sends diff to Gemini (F-15)</text>
  <text class="note" x="48" y="280">• Failures logged, do not block the push</text>
  <path class="flow" d="M330,255 L388,275" marker-end="url(#a2)"/>

  <text class="note" x="30" y="510">Note: packs &gt; ~10MB fail at API Gateway (HTTP 413). Large files use Git LFS (S3 presigned); no ALB by design.</text>
</svg>

---
# yamllint disable rule:line-length
AWSTemplateFormatVersion: '2010-09-09'
Description: GitGateway - Serverless Git hosting platform

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W2001  # EnableCodeBuild/EnableAI passed to Lambda env, not CF refs

Parameters:
  DomainName:
    Type: String
    Description: Custom domain for the service (required)
  ACMCertificateARN:
    Type: String
    Description: ACM certificate ARN for HTTPS (required)
  StackNamePrefix:
    Type: String
    Default: gitgateway
    Description: Prefix for resource naming
  EnableCodeBuild:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable CodeBuild integration
  EnableAI:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable AI features (requires Gemini API key)
  LambdaS3Bucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment package
  LambdaS3Key:
    Type: String
    Description: S3 key of the Lambda deployment ZIP
  IdpUrl:
    Type: String
    Default: ''
    Description: Identity provider URL for OAuth authentication
  CoreLayerArn:
    Type: String
    Default: ''
    Description: ARN of the core dependencies Lambda layer
  LintingLayerArn:
    Type: String
    Default: ''
    Description: ARN of the linting dependencies Lambda layer
  BinariesLayerArn:
    Type: String
    Default: ''
    Description: ARN of the binary tools Lambda layer

Conditions:
  HasCoreLayer: !Not [!Equals [!Ref CoreLayerArn, '']]
  HasLintingLayer: !Not [!Equals [!Ref LintingLayerArn, '']]
  HasBinariesLayer: !Not [!Equals [!Ref BinariesLayerArn, '']]
  HasLayers: !Or
    - !Condition HasCoreLayer
    - !Condition HasLintingLayer
    - !Condition HasBinariesLayer

Resources:
  RepoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StackNamePrefix}-repos'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms

  LfsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StackNamePrefix}-lfs'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms

  ReposTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-repos'
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  AccessTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-access'
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  PrsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-prs'
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  CommentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-comments'
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  WebhooksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-webhooks'
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  StatusChecksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-status-checks'
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-audit'
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-notifications'
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  EmbeddingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-embeddings'
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackNamePrefix}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub '${StackNamePrefix}-lambda-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StackNamePrefix}-*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-repos'
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-repos/*'
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-lfs'
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-lfs/*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:CreateSecret
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gitgateway/*'
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackNamePrefix}-handler'

  ApiHandler:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${StackNamePrefix}-handler'
      Runtime: python3.12
      Handler: gitgateway.lambda_handler.handler
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 512
      EphemeralStorage:
        Size: 10240
      Layers: !If  # yamllint disable-line rule:line-length
        - HasLayers
        - - !If [HasCoreLayer, !Ref CoreLayerArn, !Ref 'AWS::NoValue']
          - !If [HasLintingLayer, !Ref LintingLayerArn, !Ref 'AWS::NoValue']
          - !If [HasBinariesLayer, !Ref BinariesLayerArn, !Ref 'AWS::NoValue']
        - !Ref 'AWS::NoValue'
      Environment:
        Variables:
          STACK_NAME_PREFIX: !Ref StackNamePrefix
          DOMAIN_NAME: !Ref DomainName
          IDP_URL: !Ref IdpUrl

  ApiHandlerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiHandler
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${StackNamePrefix}-api'
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiHandler.Arn
      PayloadFormatVersion: '2.0'

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub 'integrations/${HttpApiIntegration}'

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref ACMCertificateARN
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultCacheBehavior:
          TargetOriginId: ApiOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        Origins:
          - Id: ApiOrigin
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  CloudFrontUrl:
    Value: !GetAtt CloudFrontDistribution.DomainName
  CustomDomainUrl:
    Value: !Sub 'https://${DomainName}'
  RepoBucketName:
    Value: !Ref RepoBucket
  LfsBucketName:
    Value: !Ref LfsBucket
  LambdaFunctionName:
    Value: !Ref ApiHandler

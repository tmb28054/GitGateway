---
# yamllint disable rule:line-length
AWSTemplateFormatVersion: '2010-09-09'
Description: GitGateway - Serverless Git hosting platform

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W2001  # EnableCodeBuild/EnableAI passed to Lambda env, not CF refs

Parameters:
  DomainName:
    Type: String
    Description: Custom domain for the service (required)
  ACMCertificateARN:
    Type: String
    Description: ACM certificate ARN for HTTPS (required)
  StackNamePrefix:
    Type: String
    Default: gitgateway
    Description: Prefix for resource naming
  EnableCodeBuild:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable CodeBuild integration
  EnableAI:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable AI features (requires Gemini API key)
  LambdaS3Bucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment package
  LambdaS3Key:
    Type: String
    Description: S3 key of the Lambda deployment ZIP
  IdpUrl:
    Type: String
    Default: ''
    Description: Identity provider URL for OAuth authentication
  JwtAudience:
    Type: String
    Default: git
    Description: >-
      Expected JWT 'aud' claim from the IdP. Must match the audience the IdP
      mints for this service (the IdP currently issues 'git'). Leave empty to
      disable audience verification (not recommended).
  CoreLayerArn:
    Type: String
    Default: ''
    Description: ARN of the core dependencies Lambda layer
  LintingLayerArn:
    Type: String
    Default: ''
    Description: ARN of the linting dependencies Lambda layer
  BinariesLayerArn:
    Type: String
    Default: ''
    Description: ARN of the binary tools Lambda layer
  AlertEmail:
    Type: String
    Default: topaz@topazhome.net
    Description: Email address subscribed to backup failure alerts
  BackupSourceKey:
    Type: String
    Default: codebuild/backup.zip
    Description: S3 key (in the repos bucket) of the backup CodeBuild source zip
  BackupScheduleExpression:
    Type: String
    Default: cron(0 5 * * ? *)
    Description: EventBridge schedule for the nightly backup (UTC)

Conditions:
  HasCoreLayer: !Not [!Equals [!Ref CoreLayerArn, '']]
  HasLintingLayer: !Not [!Equals [!Ref LintingLayerArn, '']]
  HasBinariesLayer: !Not [!Equals [!Ref BinariesLayerArn, '']]
  HasLayers: !Or
    - !Condition HasCoreLayer
    - !Condition HasLintingLayer
    - !Condition HasBinariesLayer

Resources:
  # Customer-managed KMS key used to encrypt all data stores (S3 buckets and
  # DynamoDB tables) with a single, rotatable key whose access is restricted
  # to the workload roles. Standardizes encryption at rest on a CMK rather
  # than mixing SSE-KMS / SSE-S3 / AWS-owned keys (remediation R-9).
  DataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'GitGateway data-at-rest CMK for ${StackNamePrefix}'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # Root account retains administrative control of the key.
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          # The workload roles may use (not administer) the key. Referencing
          # the role names avoids a circular dependency with the role ARNs.
          - Sid: AllowWorkloadUse
            Effect: Allow
            Principal:
              AWS:
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${StackNamePrefix}-lambda-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${StackNamePrefix}-backup-build-role'
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource: '*'

  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${StackNamePrefix}-data'
      TargetKeyId: !Ref DataKey

  RepoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StackNamePrefix}-repos'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref DataKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  RepoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RepoBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt RepoBucket.Arn
              - !Sub '${RepoBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  LfsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StackNamePrefix}-lfs'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref DataKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  LfsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LfsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt LfsBucket.Arn
              - !Sub '${LfsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  BackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StackNamePrefix}-backups'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref DataKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      # Tiered retention: daily 30d, weekly 52w (~364d), monthly 36mo (~1095d).
      LifecycleConfiguration:
        Rules:
          - Id: expire-daily
            Status: Enabled
            Prefix: daily/
            ExpirationInDays: 30
          - Id: expire-weekly
            Status: Enabled
            Prefix: weekly/
            ExpirationInDays: 364
          - Id: expire-monthly
            Status: Enabled
            Prefix: monthly/
            ExpirationInDays: 1095

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub '${BackupBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${StackNamePrefix}-alerts'
      DisplayName: GitGateway Alerts

  AlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ReposTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-repos'
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  AccessTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-access'
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  PrsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-prs'
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  CommentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-comments'
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  WebhooksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-webhooks'
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  StatusChecksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-status-checks'
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-audit'
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-notifications'
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  EmbeddingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackNamePrefix}-embeddings'
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackNamePrefix}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub '${StackNamePrefix}-lambda-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # DynamoDB access scoped to the specific tables this stack
              # owns rather than a table/${prefix}-* wildcard (R-11).
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt ReposTable.Arn
                  - !GetAtt AccessTable.Arn
                  - !GetAtt PrsTable.Arn
                  - !GetAtt CommentsTable.Arn
                  - !GetAtt WebhooksTable.Arn
                  - !GetAtt StatusChecksTable.Arn
                  - !GetAtt AuditTable.Arn
                  - !GetAtt NotificationsTable.Arn
                  - !GetAtt EmbeddingsTable.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-repos'
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-repos/*'
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-lfs'
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-lfs/*'
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-backups'
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-backups/*'
              # Runtime reads any gitgateway secret (IdP config, mirror
              # creds, Gemini key). Read is broad within the namespace;
              # write is not granted here (R-11).
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gitgateway/*'
              # The admin "update AI key" flow writes exactly one secret.
              # Grant write on only that secret rather than the whole
              # namespace, and never CreateSecret (provisioned via IaC/CLI).
              - Effect: Allow
                Action:
                  - secretsmanager:PutSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gitgateway/gemini-api-key-*'
              # Use (not administer) the data CMK for S3/DynamoDB encryption.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource:
                  - !GetAtt DataKey.Arn
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackNamePrefix}-handler'
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                Resource:
                  - !GetAtt BackupProject.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref AlertsTopic

  ApiHandler:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${StackNamePrefix}-handler'
      Runtime: python3.12
      Handler: gitgateway.lambda_handler.handler
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 512
      EphemeralStorage:
        Size: 10240
      Layers: !If  # yamllint disable-line rule:line-length
        - HasLayers
        - - !If [HasCoreLayer, !Ref CoreLayerArn, !Ref 'AWS::NoValue']
          - !If [HasLintingLayer, !Ref LintingLayerArn, !Ref 'AWS::NoValue']
          - !If [HasBinariesLayer, !Ref BinariesLayerArn, !Ref 'AWS::NoValue']
        - !Ref 'AWS::NoValue'
      Environment:
        Variables:
          STACK_NAME_PREFIX: !Ref StackNamePrefix
          DOMAIN_NAME: !Ref DomainName
          IDP_URL: !Ref IdpUrl
          GITGATEWAY_JWT_AUDIENCE: !Ref JwtAudience
          ALLOWED_ORIGINS: !Sub 'https://${DomainName}'
          REPO_BUCKET: !Ref RepoBucket
          LFS_BUCKET: !Ref LfsBucket
          BACKUP_BUCKET: !Ref BackupBucket
          ALERTS_TOPIC_ARN: !Ref AlertsTopic
          BACKUP_CODEBUILD_PROJECT: !Ref BackupProject
          BACKUP_SOURCE_BUCKET: !Ref RepoBucket
          BACKUP_SOURCE_KEY: !Ref BackupSourceKey

  ApiHandlerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiHandler
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${StackNamePrefix}-api'
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiHandler.Arn
      PayloadFormatVersion: '2.0'

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub 'integrations/${HttpApiIntegration}'

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  # Edge Web Application Firewall in front of CloudFront (R-5). Uses AWS
  # managed rule groups plus a rate-based rule. CLOUDFRONT-scope WebACLs
  # must be created in us-east-1, which is where this stack is deployed.
  # Note: WAF complements, and does not replace, the in-Lambda authn/authz.
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${StackNamePrefix}-web-acl'
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${StackNamePrefix}-web-acl'
      Rules:
        - Name: AWSCommonRules
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${StackNamePrefix}-common-rules'
        - Name: AWSKnownBadInputs
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${StackNamePrefix}-known-bad-inputs'
        - Name: RateLimit
          Priority: 2
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${StackNamePrefix}-rate-limit'

  # Log group for WAF request logging. The log-group name must start with
  # "aws-waf-logs-" for WAFv2 logging configuration to accept it.
  WafLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub 'aws-waf-logs-${StackNamePrefix}'
      RetentionInDays: 365

  WafLoggingConfiguration:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WebAcl.Arn
      LogDestinationConfigs:
        - !GetAtt WafLogGroup.Arn

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - !Ref DomainName
        WebACLId: !GetAtt WebAcl.Arn
        ViewerCertificate:
          AcmCertificateArn: !Ref ACMCertificateARN
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultCacheBehavior:
          TargetOriginId: ApiOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        Origins:
          - Id: ApiOrigin
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only

  BackupProjectRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackNamePrefix}-backup-build-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${StackNamePrefix}-backup-build-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${StackNamePrefix}-backup'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${StackNamePrefix}-backup:*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-repos'
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-repos/*'
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-lfs'
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-lfs/*'
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-backups'
                  - !Sub 'arn:aws:s3:::${StackNamePrefix}-backups/*'
              # Backup reads metadata only; it never writes to the tables,
              # so grant read-only actions scoped to the specific tables
              # rather than a wildcard with write access (R-11).
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt ReposTable.Arn
                  - !GetAtt AccessTable.Arn
                  - !GetAtt PrsTable.Arn
                  - !GetAtt CommentsTable.Arn
                  - !GetAtt WebhooksTable.Arn
                  - !GetAtt StatusChecksTable.Arn
                  - !GetAtt AuditTable.Arn
                  - !GetAtt NotificationsTable.Arn
                  - !GetAtt EmbeddingsTable.Arn
              # Decrypt source data and encrypt backup artifacts with the CMK.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource:
                  - !GetAtt DataKey.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref AlertsTopic

  BackupProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${StackNamePrefix}-backup'
      Description: Nightly Tier-2 backup and on-demand restore of repositories
      ServiceRole: !GetAtt BackupProjectRole.Arn
      TimeoutInMinutes: 480
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: BACKUP_MODE
            Value: archive
          - Name: REPO_BUCKET
            Value: !Ref RepoBucket
          - Name: LFS_BUCKET
            Value: !Ref LfsBucket
          - Name: BACKUP_BUCKET
            Value: !Ref BackupBucket
          - Name: ALERTS_TOPIC_ARN
            Value: !Ref AlertsTopic
      Source:
        Type: S3
        Location: !Sub '${StackNamePrefix}-repos/${BackupSourceKey}'
        BuildSpec: scripts/buildspec_backup.yaml

  BackupScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackNamePrefix}-backup-schedule-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${StackNamePrefix}-backup-schedule-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                Resource:
                  - !GetAtt BackupProject.Arn

  BackupScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${StackNamePrefix}-nightly-backup'
      Description: Triggers the nightly repository backup
      ScheduleExpression: !Ref BackupScheduleExpression
      State: ENABLED
      Targets:
        - Id: BackupProjectTarget
          Arn: !GetAtt BackupProject.Arn
          RoleArn: !GetAtt BackupScheduleRole.Arn

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  CloudFrontUrl:
    Value: !GetAtt CloudFrontDistribution.DomainName
  CustomDomainUrl:
    Value: !Sub 'https://${DomainName}'
  RepoBucketName:
    Value: !Ref RepoBucket
  LfsBucketName:
    Value: !Ref LfsBucket
  BackupBucketName:
    Value: !Ref BackupBucket
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  BackupProjectName:
    Value: !Ref BackupProject
  LambdaFunctionName:
    Value: !Ref ApiHandler
